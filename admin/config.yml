backend:
  name: github
  repo: 321simcom-tech/321shome-homepage
  branch: main
  base_url: https://mellifluous-semolina-e0899a.netlify.app
  auth_endpoint: api/auth

media_folder: "images"
public_folder: "images"

locale: "ko"

collections:
  - name: "site"
    label: "홈페이지 콘텐츠"
    files:
      - name: "content"
        label: "전체 페이지 콘텐츠"
        file: "content.json"
        fields:
          - label: "섹션 노출 설정"
            name: "sectionVisibility"
            widget: object
            hint: "끄면(false) 해당 섹션이 홈페이지에서 통째로 보이지 않게 됩니다."
            fields:
              - { label: "가족여행 고민(Problem)", name: "problem", widget: boolean, default: true }
              - { label: "시간을 나누기로(Solution)", name: "solution", widget: boolean, default: true }
              - { label: "2박 3일 프로그램 개요", name: "programOverview", widget: boolean, default: true }
              - { label: "DAY 01 상세", name: "day1", widget: boolean, default: true }
              - { label: "DAY 02 상세", name: "day2", widget: boolean, default: true }
              - { label: "아이 돌봄", name: "childCare", widget: boolean, default: true }
              - { label: "형제자매 프로그램", name: "sibling", widget: boolean, default: true }
              - { label: "부모 자유시간", name: "parentFree", widget: boolean, default: true }
              - { label: "DAY 03 다시 함께", name: "day3", widget: boolean, default: true }
              - { label: "WHY 321SIM", name: "why", widget: boolean, default: true }
              - { label: "SAFETY 6단계", name: "safety", widget: boolean, default: true }
              - { label: "여행 이야기", name: "travel", widget: boolean, default: true }
              - { label: "후기", name: "story", widget: boolean, default: true }
              - { label: "FAQ", name: "faq", widget: boolean, default: true }
              - { label: "FINAL CTA", name: "finalCta", widget: boolean, default: true }

          - label: "사이트 정보"
            name: "site"
            widget: object
            fields:
              - { label: "사이트 이름", name: "name", widget: string }
              - { label: "회사명(태그라인)", name: "tagline", widget: string }
              - { label: "로고 이미지(비워두면 기본 아이콘 표시)", name: "logoImage", widget: image, required: false }

          - label: "상단 메뉴"
            name: "nav"
            widget: object
            fields:
              - label: "메뉴 항목"
                name: "items"
                widget: list
                fields:
                  - { label: "메뉴 이름", name: "label", widget: string }
                  - { label: "이동 링크(#로 시작)", name: "href", widget: string }
              - { label: "참여 상담 버튼 텍스트", name: "cta", widget: string }

          - label: "히어로(맨 위 화면)"
            name: "hero"
            widget: object
            fields:
              - { label: "제목 1줄", name: "titleLine1", widget: string }
              - { label: "제목 2줄 앞부분", name: "titlePlain", widget: string }
              - { label: "제목 2줄 강조부분", name: "titleHighlight", widget: string }
              - { label: "부제 문단", name: "sub", widget: text, hint: "Enter 키를 누르면 그 위치에서 줄바꿈됩니다" }
              - label: "4개 핵심가치"
                name: "values"
                widget: list
                fields:
                  - { label: "아이콘", name: "icon", widget: select, options: ["parent", "child", "sibling", "family"] }
                  - { label: "라벨", name: "label", widget: string }
                  - { label: "설명", name: "sub", widget: string }
              - { label: "기본 버튼 텍스트", name: "ctaPrimary", widget: string }
              - { label: "기본 버튼 링크", name: "ctaPrimaryHref", widget: string }
              - { label: "보조 버튼 텍스트", name: "ctaSecondary", widget: string }
              - { label: "보조 버튼 링크", name: "ctaSecondaryHref", widget: string }
              - { label: "배경 사진", name: "photoImage", widget: image }
              - { label: "사진 대체 텍스트", name: "photoAlt", widget: string }

          - label: "가족여행 고민(Problem)"
            name: "problem"
            widget: object
            fields:
              - { label: "제목", name: "heading", widget: string }
              - label: "카드 3개"
                name: "cards"
                widget: list
                fields:
                  - { label: "사진", name: "image", widget: image }
                  - { label: "본문", name: "body", widget: text, hint: "Enter 키를 누르면 그 위치에서 줄바꿈됩니다" }
              - { label: "하단 마무리 카피", name: "closing", widget: text, hint: "Enter 키를 누르면 그 위치에서 줄바꿈됩니다" }

          - label: "시간을 나누기로(Solution)"
            name: "solution"
            widget: object
            fields:
              - { label: "제목", name: "heading", widget: text, hint: "Enter 키를 누르면 그 위치에서 줄바꿈됩니다" }
              - label: "대상별 카드(부모/아이/형제자매)"
                name: "roles"
                widget: list
                fields:
                  - { label: "작은 라벨", name: "tag", widget: string }
                  - { label: "제목", name: "title", widget: string }
                  - { label: "본문", name: "body", widget: text, hint: "Enter 키를 누르면 그 위치에서 줄바꿈됩니다" }
              - label: "3일차 재회 카드"
                name: "reunion"
                widget: object
                fields:
                  - { label: "작은 라벨", name: "tag", widget: string }
                  - { label: "제목", name: "title", widget: string }
                  - { label: "본문", name: "body", widget: text, hint: "Enter 키를 누르면 그 위치에서 줄바꿈됩니다" }

          - label: "2박 3일 프로그램 개요"
            name: "programOverview"
            widget: object
            fields:
              - { label: "제목", name: "heading", widget: string }
              - { label: "부제", name: "sub", widget: string }
              - label: "일자별 카드"
                name: "days"
                widget: list
                fields:
                  - { label: "일차 라벨(예: DAY 01)", name: "n", widget: string }
                  - { label: "시간대", name: "time", widget: string, required: false }
                  - { label: "제목", name: "title", widget: string }
                  - label: "흐름 목록"
                    name: "flow"
                    widget: list
                    field: { label: "항목", name: "item", widget: string }
              - { label: "하단 마무리 카피", name: "closing", widget: text, hint: "Enter 키를 누르면 그 위치에서 줄바꿈됩니다" }

          - label: "DAY 01 상세"
            name: "day1"
            widget: object
            fields:
              - { label: "제목", name: "heading", widget: string }
              - label: "타임라인 스텝"
                name: "steps"
                widget: list
                fields:
                  - { label: "시간", name: "time", widget: string }
                  - { label: "제목", name: "title", widget: string }
                  - { label: "설명", name: "body", widget: string }
              - label: "부모/아이/형제자매 분리"
                name: "split"
                widget: list
                fields:
                  - { label: "대상", name: "who", widget: string }
                  - { label: "내용", name: "what", widget: string }
              - { label: "하단 마무리 카피", name: "closing", widget: text, hint: "Enter 키를 누르면 그 위치에서 줄바꿈됩니다" }

          - label: "DAY 02 상세"
            name: "day2"
            widget: object
            fields:
              - { label: "제목", name: "heading", widget: string }
              - { label: "시간대", name: "time", widget: string }
              - label: "부모/아이/형제자매 분리"
                name: "split"
                widget: list
                fields:
                  - { label: "대상", name: "who", widget: string }
                  - { label: "내용", name: "what", widget: string }
              - { label: "재회 문구", name: "reunionNote", widget: text, hint: "Enter 키를 누르면 그 위치에서 줄바꿈됩니다" }
              - { label: "부모 자유시간 소제목", name: "parentTimeHeading", widget: text, hint: "Enter 키를 누르면 그 위치에서 줄바꿈됩니다" }
              - label: "부모 자유시간 항목"
                name: "parentTimeItems"
                widget: list
                field: { label: "항목", name: "item", widget: string }

          - label: "아이 돌봄(Child Care)"
            name: "childCare"
            widget: object
            fields:
              - { label: "제목", name: "heading", widget: text, hint: "Enter 키를 누르면 그 위치에서 줄바꿈됩니다" }
              - { label: "부제", name: "sub", widget: text, hint: "Enter 키를 누르면 그 위치에서 줄바꿈됩니다" }
              - label: "프로그램 목록"
                name: "programs"
                widget: list
                field: { label: "항목", name: "item", widget: string }
              - { label: "대표 사진", name: "image", widget: image }

          - label: "형제자매 프로그램"
            name: "sibling"
            widget: object
            fields:
              - { label: "제목", name: "heading", widget: text, hint: "Enter 키를 누르면 그 위치에서 줄바꿈됩니다" }
              - { label: "부제", name: "sub", widget: text, hint: "Enter 키를 누르면 그 위치에서 줄바꿈됩니다" }
              - label: "프로그램 목록"
                name: "programs"
                widget: list
                field: { label: "항목", name: "item", widget: string }
              - { label: "대표 사진", name: "image", widget: image }

          - label: "부모 자유시간"
            name: "parentFree"
            widget: object
            fields:
              - { label: "제목", name: "heading", widget: text, hint: "Enter 키를 누르면 그 위치에서 줄바꿈됩니다" }
              - { label: "부제", name: "sub", widget: text, hint: "Enter 키를 누르면 그 위치에서 줄바꿈됩니다" }
              - label: "추천 활동"
                name: "activities"
                widget: list
                field: { label: "항목", name: "item", widget: string }
              - { label: "한 줄 카피", name: "quote", widget: string }
              - { label: "대표 사진", name: "image", widget: image }

          - label: "DAY 03 다시, 함께"
            name: "day3"
            widget: object
            fields:
              - { label: "작은 태그", name: "tag", widget: string }
              - { label: "제목", name: "heading", widget: string }
              - { label: "본문", name: "body", widget: text, hint: "Enter 키를 누르면 그 위치에서 줄바꿈됩니다" }
              - label: "흐름 목록"
                name: "flow"
                widget: list
                field: { label: "항목", name: "item", widget: string }
              - { label: "마무리 카피", name: "closing", widget: string }
              - { label: "배경 사진", name: "image", widget: image }

          - label: "WHY 321SIM"
            name: "why"
            widget: object
            fields:
              - { label: "제목", name: "heading", widget: string }
              - label: "5개 이유"
                name: "items"
                widget: list
                fields:
                  - { label: "번호(01~05)", name: "n", widget: string }
                  - { label: "제목", name: "title", widget: string }
                  - { label: "설명", name: "body", widget: text, hint: "Enter 키를 누르면 그 위치에서 줄바꿈됩니다" }

          - label: "SAFETY(안전 6단계)"
            name: "safety"
            widget: object
            fields:
              - { label: "제목", name: "heading", widget: string }
              - label: "6단계 프로세스"
                name: "steps"
                widget: list
                fields:
                  - { label: "번호(01~06)", name: "n", widget: string }
                  - { label: "제목", name: "title", widget: string }
                  - { label: "설명", name: "body", widget: string }
              - { label: "실적 근거 문구", name: "proofNote", widget: text }

          - label: "여행 이야기(Travel)"
            name: "travel"
            widget: object
            fields:
              - { label: "제목", name: "heading", widget: text, hint: "Enter 키를 누르면 그 위치에서 줄바꿈됩니다" }
              - label: "지역 카드"
                name: "regions"
                widget: list
                fields:
                  - { label: "지역명", name: "name", widget: string }
                  - { label: "설명", name: "body", widget: string }
              - { label: "부모 추천 라벨", name: "parentRecommendLabel", widget: string }
              - label: "부모 추천 항목"
                name: "parentRecommendItems"
                widget: list
                field: { label: "항목", name: "item", widget: string }
              - { label: "버튼 텍스트", name: "cta", widget: string }

          - label: "후기(Story)"
            name: "story"
            widget: object
            fields:
              - { label: "제목", name: "heading", widget: string }
              - { label: "실적 한 줄", name: "proofLine", widget: string }
              - label: "후기 카드"
                name: "testimonials"
                widget: list
                fields:
                  - { label: "인용문", name: "quote", widget: text }
                  - { label: "작성자 표기", name: "author", widget: string }
              - { label: "협력 기관 라벨", name: "partnersLabel", widget: string }
              - label: "협력 기관 목록"
                name: "partners"
                widget: list
                field: { label: "기관명", name: "item", widget: string }
              - { label: "B2B 안내 문구", name: "b2bNote", widget: string }

          - label: "FAQ"
            name: "faq"
            widget: object
            fields:
              - { label: "제목", name: "heading", widget: string }
              - label: "카테고리 그룹"
                name: "groups"
                widget: list
                summary: "{{fields.label}}"
                fields:
                  - { label: "그룹 이름", name: "label", widget: string }
                  - label: "질문/답변 목록"
                    name: "items"
                    widget: list
                    summary: "{{fields.q}}"
                    fields:
                      - { label: "질문", name: "q", widget: string }
                      - { label: "답변", name: "a", widget: text, hint: "Enter 키를 누르면 그 위치에서 줄바꿈됩니다" }

          - label: "FINAL CTA(하단 마지막)"
            name: "finalCta"
            widget: object
            fields:
              - { label: "작은 라벨", name: "eyebrow", widget: string }
              - { label: "제목", name: "heading", widget: text, hint: "Enter 키를 누르면 그 위치에서 줄바꿈됩니다" }
              - label: "강조 줄 목록"
                name: "lines"
                widget: list
                field: { label: "줄", name: "line", widget: string }
              - { label: "버튼 텍스트", name: "cta", widget: string }
              - { label: "버튼 링크", name: "ctaHref", widget: string }
              - { label: "배경 사진", name: "image", widget: image }

          - label: "푸터(하단 정보)"
            name: "footer"
            widget: object
            fields:
              - { label: "회사명", name: "companyName", widget: string }
              - { label: "대표자·사업자등록번호 한 줄", name: "legalLine", widget: string }
              - { label: "주소", name: "address", widget: string }
              - { label: "전화번호", name: "phone", widget: string }
              - { label: "이메일", name: "email", widget: string }
              - { label: "저작권 문구", name: "copyright", widget: string }
