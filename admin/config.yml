backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "images"

locale: "ko"

collections:
  - name: "site"
    label: "홈페이지 콘텐츠"
    files:
      - name: "content"
        label: "전체 페이지 콘텐츠"
        file: "content.json"
        fields:
          - label: "사이트 정보"
            name: "site"
            widget: object
            fields:
              - { label: "사이트 이름", name: "name", widget: string }
              - { label: "태그라인", name: "tagline", widget: string }

          - label: "상단 메뉴"
            name: "nav"
            widget: object
            fields:
              - label: "메뉴 항목"
                name: "items"
                widget: list
                fields:
                  - { label: "메뉴 이름", name: "label", widget: string }
                  - { label: "이동 링크(#로 시작)", name: "href", widget: string }
              - { label: "기업·기관 문의 링크 텍스트", name: "partnersLink", widget: string }
              - { label: "참가 신청 버튼 텍스트", name: "cta", widget: string }

          - label: "히어로(맨 위 화면)"
            name: "hero"
            widget: object
            fields:
              - { label: "상단 배지 텍스트", name: "badge", widget: string }
              - { label: "제목 앞부분", name: "titlePlain", widget: string }
              - { label: "제목 강조 부분(색상 강조됨)", name: "titleHighlight", widget: string }
              - { label: "제목 둘째 줄", name: "titleLine2", widget: string }
              - { label: "부제 문단", name: "subcopy", widget: text }
              - label: "강조 칩 목록"
                name: "chips"
                widget: list
                field: { label: "칩 텍스트", name: "chip", widget: string }
              - { label: "기본 버튼 텍스트", name: "ctaPrimary", widget: string }
              - { label: "기본 버튼 링크", name: "ctaPrimaryHref", widget: string }
              - { label: "보조 버튼 텍스트", name: "ctaSecondary", widget: string }
              - { label: "보조 버튼 링크", name: "ctaSecondaryHref", widget: string }
              - { label: "대표 사진", name: "photoImage", widget: image }
              - { label: "사진 대체 텍스트(설명)", name: "photoAlt", widget: string }
              - { label: "사진 옆 캡션 카드 문구", name: "photoCaption", widget: string }

          - label: "문제 인식 섹션"
            name: "problem"
            widget: object
            fields:
              - { label: "제목", name: "heading", widget: string }
              - label: "카드 목록"
                name: "cards"
                widget: list
                fields:
                  - { label: "카드 제목", name: "title", widget: string }
                  - { label: "카드 본문", name: "body", widget: text }

          - label: "솔루션 섹션"
            name: "solution"
            widget: object
            fields:
              - { label: "제목", name: "heading", widget: string }
              - { label: "부제", name: "sub", widget: text }
              - label: "대상별 카드(아동/형제자매/부모 순서 고정)"
                name: "roles"
                widget: list
                fields:
                  - { label: "작은 라벨", name: "tag", widget: string }
                  - { label: "카드 제목", name: "title", widget: string }
                  - { label: "카드 본문", name: "body", widget: text }
              - label: "다이어그램 라벨(3개, 아동/형제자매/부모 순서 고정)"
                name: "diagramLabels"
                widget: list
                field: { label: "라벨", name: "label", widget: string }
              - { label: "다이어그램 가운데 배지 텍스트", name: "diagramBadge", widget: string }
              - { label: "타임라인 요약 문구", name: "timelineNote", widget: text }
              - label: "타임라인 항목"
                name: "timelineItems"
                widget: list
                fields:
                  - { label: "시간대", name: "time", widget: string }
                  - { label: "설명", name: "text", widget: string }

          - label: "비교 섹션(일반 여행 vs 삼이일심)"
            name: "compare"
            widget: object
            fields:
              - { label: "제목", name: "heading", widget: string }
              - label: "비교 행"
                name: "rows"
                widget: list
                fields:
                  - { label: "구분 라벨", name: "label", widget: string }
                  - { label: "일반 여행/기존 캠프", name: "a", widget: text }
                  - { label: "삼이일심", name: "b", widget: text }
              - { label: "마무리 문구", name: "closing", widget: string }

          - label: "일정 섹션(2박 3일)"
            name: "schedule"
            widget: object
            fields:
              - { label: "제목", name: "heading", widget: string }
              - label: "일자별 일정"
                name: "days"
                widget: list
                fields:
                  - { label: "일차 라벨(예: 1일차)", name: "n", widget: string }
                  - { label: "일차 제목", name: "title", widget: string }
                  - { label: "시작 표시(예: 10시)", name: "start", widget: string }
                  - { label: "종료 표시(예: 20시)", name: "end", widget: string }
                  - { label: "가운데 표시 텍스트", name: "mid", widget: string }
                  - { label: "막대 시작 시각(숫자, 10~20)", name: "barFrom", widget: number }
                  - { label: "막대 종료 시각(숫자, 10~20)", name: "barTo", widget: number }
                  - label: "세부 항목"
                    name: "items"
                    widget: list
                    field: { label: "항목", name: "item", widget: string }

          - label: "안심 케어 섹션"
            name: "care"
            widget: object
            fields:
              - { label: "제목", name: "heading", widget: string }
              - label: "인력 카드"
                name: "roles"
                widget: list
                fields:
                  - { label: "인원 수", name: "count", widget: string }
                  - { label: "단위(예: 명)", name: "unit", widget: string }
                  - { label: "직군명", name: "title", widget: string }
                  - { label: "설명", name: "body", widget: text }
                  - { label: "배지 텍스트(없으면 비워두기)", name: "badge", widget: string, required: false }
              - { label: "운영 담당자 카드 제목", name: "operatorTitle", widget: string }
              - { label: "운영 담당자 카드 설명", name: "operatorBody", widget: string }
              - { label: "협력 전문가 라벨", name: "expertGroupLabel", widget: string }
              - label: "협력 전문가 그룹 목록"
                name: "expertGroups"
                widget: list
                field: { label: "기관명", name: "group", widget: string }

          - label: "강진 이야기 섹션"
            name: "gangjin"
            widget: object
            fields:
              - { label: "작은 태그(예: WHERE)", name: "tag", widget: string }
              - { label: "제목", name: "heading", widget: string }
              - label: "장소 타일"
                name: "tiles"
                widget: list
                fields:
                  - { label: "장소 이름", name: "name", widget: string }
                  - { label: "사진", name: "image", widget: image }
              - { label: "하단 안내 문구", name: "note", widget: text }

          - label: "실증 성과 섹션"
            name: "results"
            widget: object
            fields:
              - { label: "제목", name: "heading", widget: string }
              - { label: "부제", name: "sub", widget: string }
              - { label: "대표 사진(큰 사진)", name: "mainImage", widget: image }
              - { label: "대표 사진 캡션", name: "mainCaption", widget: string }
              - label: "작은 사진 4장"
                name: "gridImages"
                widget: list
                fields:
                  - { label: "캡션", name: "caption", widget: string }
                  - { label: "사진", name: "image", widget: image }
              - label: "참가자 후기"
                name: "testimonial"
                widget: object
                fields:
                  - { label: "인용문", name: "quote", widget: text }
                  - { label: "작성자 표기", name: "author", widget: string }
              - label: "통계 카드"
                name: "stats"
                widget: list
                fields:
                  - { label: "숫자/값", name: "value", widget: string }
                  - { label: "설명", name: "label", widget: string }
              - { label: "2026 목표 라벨", name: "goalsLabel", widget: string }
              - label: "2026 목표 목록"
                name: "goals"
                widget: list
                field: { label: "목표", name: "goal", widget: string }
              - { label: "언론 보도 소제목", name: "newsHeading", widget: string }
              - label: "언론 보도"
                name: "news"
                widget: object
                fields:
                  - { label: "기사 제목", name: "title", widget: string }
                  - { label: "매체·날짜", name: "source", widget: string }
              - { label: "협력 기관 라벨", name: "partnersLabel", widget: string }
              - label: "협력 기관 목록"
                name: "partners"
                widget: list
                field: { label: "기관명", name: "partner", widget: string }

          - label: "기업·기관 파트너 섹션"
            name: "partners"
            widget: object
            fields:
              - { label: "제목", name: "heading", widget: string }
              - label: "파트너십 카드"
                name: "cards"
                widget: list
                fields:
                  - { label: "카드 제목", name: "title", widget: string }
                  - { label: "카드 본문", name: "body", widget: text }
              - { label: "버튼 텍스트", name: "cta", widget: string }

          - label: "회사 소개 섹션"
            name: "about"
            widget: object
            fields:
              - { label: "제목", name: "heading", widget: string }
              - { label: "소개 문단", name: "lead", widget: text }
              - { label: "소개 문단 중 강조할 단어(문단 안에 있는 문구와 정확히 일치해야 함)", name: "leadHighlight", widget: string }
              - label: "회사 정보 표"
                name: "info"
                widget: list
                fields:
                  - { label: "항목명", name: "term", widget: string }
                  - { label: "값", name: "value", widget: string }
              - label: "ESG 카드"
                name: "esg"
                widget: list
                fields:
                  - { label: "태그", name: "tag", widget: string }
                  - { label: "설명", name: "body", widget: text }

          - label: "참가 신청 섹션(하단)"
            name: "apply"
            widget: object
            fields:
              - { label: "제목", name: "heading", widget: string }
              - { label: "부제", name: "sub", widget: text }
              - { label: "이메일 문의 버튼 텍스트", name: "ctaEmail", widget: string }
              - { label: "기업 문의 버튼 텍스트", name: "ctaPartner", widget: string }
              - { label: "전화 상담 버튼 텍스트", name: "ctaPhone", widget: string }
              - { label: "문의 이메일 주소", name: "email", widget: string }
              - { label: "전화번호(숫자만)", name: "phone", widget: string }

          - label: "푸터(하단 정보)"
            name: "footer"
            widget: object
            fields:
              - { label: "회사명", name: "companyName", widget: string }
              - { label: "대표자·사업자번호 줄", name: "infoLine1", widget: string }
              - { label: "주소 줄", name: "infoLine2", widget: string }
              - { label: "연락처 줄", name: "infoLine3", widget: string }
              - label: "링크 목록"
                name: "links"
                widget: list
                fields:
                  - { label: "링크 텍스트", name: "label", widget: string }
                  - { label: "링크 주소", name: "href", widget: string }
              - { label: "지원사업 라벨", name: "programsLabel", widget: string }
              - label: "지원사업 목록"
                name: "programs"
                widget: list
                field: { label: "항목", name: "program", widget: string }
              - { label: "저작권 문구", name: "copyright", widget: string }
